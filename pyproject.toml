[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "referral"
version = "0.1.0"
description = "Verified track records for agents that hire agents (MIT IDS.865 final project)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=2.1"]

[project.scripts]
referral = "referral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
